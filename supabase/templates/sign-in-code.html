<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Your Wedded sign-in code</title>
  </head>
  <!-- Email clients drop <style> and web fonts, so everything is inline: tables for layout,
       Georgia for the serif lines, the system font for the code. -->
  <body
    style="
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #000000;
      -webkit-text-size-adjust: 100%;
    "
  >
    <!-- The line the inbox shows under the subject, so the code can be read without opening the email -->
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all">
      {{ .Token }} is your Wedded code. It works for 15 minutes.
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background: #ffffff"
    >
      <tr>
        <td align="center" style="padding: 48px 24px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 420px"
          >
            <tr>
              <td
                style="
                  padding: 0 0 40px;
                  font-family: Georgia, 'Times New Roman', serif;
                  font-size: 24px;
                  color: #8a1c30;
                "
              >
                Wedded
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 0 12px;
                  font-family: Georgia, 'Times New Roman', serif;
                  font-size: 32px;
                  line-height: 1.2;
                  color: #000000;
                "
              >
                Your sign-in code
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 0 28px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
                    sans-serif;
                  font-size: 17px;
                  line-height: 1.5;
                  color: #3c3c43;
                "
              >
                Type it in the app to finish signing in.
              </td>
            </tr>
            <tr>
              <td
                align="center"
                style="
                  padding: 22px 12px 22px 22px;
                  background: #f2f2f7;
                  border-radius: 16px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
                    sans-serif;
                  font-size: 40px;
                  font-weight: 600;
                  letter-spacing: 10px;
                  color: #000000;
                "
              >
                {{ .Token }}
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 0 40px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
                    sans-serif;
                  font-size: 16px;
                  line-height: 1.5;
                  color: #3c3c43;
                "
              >
                It works for 15 minutes.
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 0 0;
                  border-top: 1px solid #e5e5ea;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
                    sans-serif;
                  font-size: 16px;
                  line-height: 1.5;
                  color: #6c6c70;
                "
              >
                Didn't ask for this? You can ignore this email. Nobody can sign in without the code.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
