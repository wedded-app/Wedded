<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 24px; background: #fdf8f0; font-family: Arial, Helvetica, sans-serif; color: #2b1a12;">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 28px;">
      <h1 style="font-size: 24px; margin: 0 0 16px;">Your sign-in code</h1>
      <p style="font-size: 18px; line-height: 1.5; margin: 0 0 16px;">Type this code in the app:</p>
      <p style="font-size: 40px; font-weight: bold; letter-spacing: 8px; margin: 0 0 24px;">{{ .Token }}</p>
      <p style="font-size: 16px; line-height: 1.5; margin: 0; color: #5c4a40;">
        The code works for 15 minutes. If you didn't ask for it, you can ignore this email.
      </p>
    </div>
  </body>
</html>
