name: Shared demo

# Every merge to main goes live on the shared demo, so both founders always
# see the latest: the backend server on AWS (infra/README.md) gets the new
# migrations, server code and settings, then the app is published to the
# "demo" channel that we open in Expo Go. The server's address and public key
# live in the Expo project's "preview" environment, not here.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID      the WeddedBackend stack's DeployUser key (infra/README.md)
#   AWS_SECRET_ACCESS_KEY
#   EXPO_TOKEN             an Expo access token (expo.dev → Account settings → Access tokens)
# Until they're set, the steps that need them are skipped with a note.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time, in merge order
concurrency:
  group: shared-demo
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to the shared demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The backend first, so the app never runs against an older schema
      - name: Update the backend server on AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice::AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY isn't set, so the AWS backend wasn't updated."
            exit 0
          fi
          npm run backend -- deploy

      # A green deploy only proves the migrations ran; this proves the app can read
      - name: Check the server answers
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          [ -n "$AWS_ACCESS_KEY_ID" ] || exit 0
          npm run backend -- check

      - name: Publish the app to the demo channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN isn't set, so the app wasn't published to the demo."
            exit 0
          fi
          npx eas-cli@latest update --channel demo --environment preview \
            --message "$(git log -1 --pretty=%s)" --non-interactive
