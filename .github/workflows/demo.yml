name: Shared demo

# Every merge to main goes live on the shared demo, so both founders always
# see the latest: the demo database (the hosted Supabase project) gets the new
# migrations and server code, then the app is published to the "demo" channel
# that we open in Expo Go. The demo's database address and public key live in
# the Expo project's "preview" environment, not here.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN             an Expo access token (expo.dev → Account settings → Access tokens)
#   SUPABASE_ACCESS_TOKEN  a Supabase access token (supabase.com → Account → Access tokens)
#   DEMO_DB_PASSWORD       the demo database's password
# Until they're set, the steps that need them are skipped with a note.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time, in merge order
concurrency:
  group: shared-demo
  cancel-in-progress: false

env:
  DEMO_PROJECT_REF: ujkshrptgmbtstrjcyfy

jobs:
  publish:
    name: Publish to the shared demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The database first, so the app never runs against an older schema.
      # No --include-seed: the sample vendors went in once, at setup.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - name: Update the demo database and server code
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEMO_DB_PASSWORD: ${{ secrets.DEMO_DB_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$DEMO_DB_PASSWORD" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN or DEMO_DB_PASSWORD isn't set, so the demo database wasn't updated."
            exit 0
          fi
          supabase link --project-ref "$DEMO_PROJECT_REF" --password "$DEMO_DB_PASSWORD"
          # --include-all: branches built side by side can merge a migration dated
          # before one the demo already has
          supabase db push --password "$DEMO_DB_PASSWORD" --include-all --yes
          supabase functions deploy --project-ref "$DEMO_PROJECT_REF" --use-api

      - name: Publish the app to the demo channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN isn't set, so the app wasn't published to the demo."
            exit 0
          fi
          npx eas-cli@latest update --channel demo --environment preview \
            --message "$(git log -1 --pretty=%s)" --non-interactive
