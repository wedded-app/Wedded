name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  check:
    name: Lint, format, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --ci
      # The web build: families who scan a QR code without the app land on it.
      # The values are placeholders; pre-rendering never calls Supabase.
      - name: Build for web
        run: npx expo export --platform web --output-dir /tmp/web
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  # Build a fresh database from supabase/migrations and check it: the pgTAP
  # tests in supabase/tests, Supabase's security and performance advisors, and
  # that src/types/database.ts still matches the schema. A PR that breaks the
  # database or its access rules can't merge itself.
  database:
    name: Database migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - name: Build the database from the migrations
        run: supabase db start
      # Require an explicit PASS, so a run that finds no test files can't
      # pass silently
      - name: Run the database tests
        shell: bash
        run: |
          supabase test db | tee test-output.txt
          grep -q '^Result: PASS' test-output.txt
      # Our schemas only: extensions like PostGIS ship their own functions
      # that the linter flags
      - name: Lint database functions
        run: supabase db lint --local --schema public,private --fail-on warning
      - name: Security and performance advisors
        run: supabase db advisors --local --fail-on warn
      - name: Generated types match the schema
        shell: bash
        run: |
          npm run db:types
          if ! git diff --exit-code src/types/database.ts; then
            echo "::error::src/types/database.ts is out of date. Run npm run db:types and commit it."
            exit 1
          fi

  # Edge Functions are Deno code: type-check, lint, format-check and test each one
  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check, lint, format-check and test every function
        shell: bash
        run: |
          for dir in supabase/functions/*/; do
            case "$dir" in */_*) continue ;; esac
            echo "::group::$dir"
            (cd "$dir" && deno check index.ts && deno lint && deno fmt --check && deno test --allow-env --permit-no-files)
            echo "::endgroup::"
          done
          echo "::group::supabase/functions/_shared/"
          (cd supabase/functions/_shared && deno lint && deno fmt --check && deno test --allow-env)
          echo "::endgroup::"

  # AWS infrastructure (infra/): type-check, test the photo resizing and build
  # the CloudFormation template, so a broken stack can't merge. Nothing is
  # deployed from here yet: a founder runs `npx cdk deploy` (infra/README.md).
  infra:
    name: AWS infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx cdk synth --quiet

  # Squash-merge the PR into main as soon as the checks pass, so nobody has to
  # click merge. Drafts are skipped: open a draft when the other founder should
  # look first, then mark it ready.
  merge:
    name: Merge when checks pass
    needs: [check, database, functions, infra]
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # --match-head-commit refuses to merge if new commits landed after this
      # run started, so only the exact code that passed gets merged
      - name: Squash-merge into main
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash
          --match-head-commit "$HEAD_SHA" --subject "$TITLE (#$PR)" --body ""
      # The repo's "Automatically delete head branches" skips merges made with
      # github.token, so delete the branch here. Never fails the merge.
      - name: Delete the merged branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: >-
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF"
          || echo "::notice::Couldn't delete $HEAD_REF; delete it by hand."
      # A push made with github.token never starts other workflows, so the
      # merge above can't trigger demo.yml's push trigger; starting it by hand
      # is the one thing github.token is allowed to do
      - name: Publish the merge to the shared demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run demo.yml --repo "$GITHUB_REPOSITORY" --ref main
